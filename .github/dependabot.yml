version: 2
updates:
  # Go SDK dependencies
  - package-ecosystem: gomod
    directory: "/go"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      go-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/basecamp/*"
          - "go.opentelemetry.io/*"
    ignore:
      # client_golang's requirement in go/go.mod is a floor, not a pin: as a
      # library, whatever we require is forced on every downstream app by MVS
      # (1.25.0 changed api/prometheus/v1 signatures, #997). Raise it only when
      # the SDK starts using a newer API or the floor has a known vulnerability.
      # Compatibility with the latest release is tested instead by the "Go Tests
      # (latest dependencies)" job in .github/workflows/go-latest-deps.yml, on
      # every PR and weekly.
      #
      # Security updates still come: for them dependabot-core honours only an
      # ignore's `versions` list and skips update-types (IgnoreCondition#
      # ignored_versions, `return versions if security_updates_only`), so leave
      # `versions` off this entry or a vulnerable floor loses its security PR.
      - dependency-name: "github.com/prometheus/client_golang"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

      # The other third-party direct requirements in go/go.mod are floors on the
      # same terms as client_golang: raise one only when the SDK starts using a
      # newer API or the floor has a known vulnerability, and leave `versions`
      # off each entry so its security updates still come (see above). The
      # "Go Tests (latest dependencies)" job tests their latest releases.
      # Each entry notes what bounded its floor when this was written
      # (2026-10, govulncheck v1.8.0's database).
      #
      # The four otel modules move together; otel/sdk requires the matching
      # otel. Older releases build and pass the SDK's tests (v1.20.0 was the
      # oldest tried), but otel/sdk has known vulnerabilities before v1.45.0
      # (GO-2026-6505), so no floor below that is acceptable. otel/log is only
      # an indirect requirement (otel itself requires it), but it is ignored
      # as well: it requires the matching otel, otel/metric and otel/trace, so
      # an update to it would raise all three.
      - dependency-name: "go.opentelemetry.io/otel"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "go.opentelemetry.io/otel/metric"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "go.opentelemetry.io/otel/sdk"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "go.opentelemetry.io/otel/trace"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "go.opentelemetry.io/otel/log"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # v1.8.12 is the first release under the github.com/coder/websocket path;
      # earlier tags declare nhooyr.io/websocket.
      - dependency-name: "github.com/coder/websocket"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # Used by the generated client. Every v1 release builds and passes the
      # SDK's tests, and none has a known vulnerability of its own.
      - dependency-name: "github.com/oapi-codegen/runtime"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # Get, Set and Delete only, all present since v0.1.0. The SDK's tests run
      # against the file store, not a real keyring, so they don't vouch for
      # older releases. v0.1.0 also still uses godbus/dbus v4.
      - dependency-name: "github.com/zalando/go-keyring"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # github.com/basecamp/* (actioncable-go, surfguard) are deliberately not
      # ignored. We publish them and Dependabot's PR is how we hear about
      # their releases; a fix in either (surfguard is the OAuth endpoint
      # guard) may never reach the Go vulnerability database, and the
      # latest-dependencies job only runs the new release, it doesn't
      # announce it.
    commit-message:
      prefix: "deps(go):"
    labels:
      - "dependencies"
      - "go"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # Kotlin SDK dependencies
  - package-ecosystem: gradle
    directory: "/kotlin"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      ktor:
        patterns:
          - "io.ktor:*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx:*"
      gradle-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "io.ktor:*"
          - "org.jetbrains.kotlinx:*"
    commit-message:
      prefix: "deps(kotlin):"
    labels:
      - "dependencies"
      - "kotlin"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # TypeScript SDK dependencies
  - package-ecosystem: npm
    directory: "/typescript"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # openapi-typescript 7.x peers on typescript ^5.x; revisit when upstream
      # publishes TS 6 support (openapi-ts/openapi-typescript#2723).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # msw 3 intercepts Node at the socket level: reused connections can skip
      # the mocks (mswjs/interceptors#862) and undici rejects the oauth tests'
      # malformed Content-Length before the SDK's guard runs. See #998.
      - dependency-name: "msw"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(ts):"
    labels:
      - "dependencies"
      - "typescript"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # Ruby SDK dependencies
  - package-ecosystem: bundler
    directory: "/ruby"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      bundler-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(ruby):"
    labels:
      - "dependencies"
      - "ruby"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # Root package (npm publishing shim)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      root-npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(root):"
    labels:
      - "dependencies"
      - "typescript"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # GitHub Actions dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(actions):"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 10

  # Conformance runner — Go
  - package-ecosystem: gomod
    directory: "/conformance/runner/go"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      conformance-go-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(conformance-go):"
    labels:
      - "dependencies"
      - "go"
      - "conformance"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # Conformance runner — TypeScript
  - package-ecosystem: npm
    directory: "/conformance/runner/typescript"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      conformance-npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(conformance-ts):"
    labels:
      - "dependencies"
      - "typescript"
      - "conformance"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # Conformance runner — Ruby
  - package-ecosystem: bundler
    directory: "/conformance/runner/ruby"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      conformance-bundler-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(conformance-ruby):"
    labels:
      - "dependencies"
      - "ruby"
      - "conformance"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # Rust SDK dependencies (workspace: basecamp-sdk + generator)
  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      tokio-ecosystem:
        patterns:
          - "tokio*"
          - "hyper*"
          - "tower*"
          - "reqwest"
      serde:
        patterns:
          - "serde*"
      cargo-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "tokio*"
          - "hyper*"
          - "tower*"
          - "reqwest"
          - "serde*"
    commit-message:
      prefix: "deps(rust):"
    labels:
      - "dependencies"
      - "rust"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # Conformance runner — Rust
  - package-ecosystem: cargo
    directory: "/conformance/runner/rust"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      conformance-cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(conformance-rust):"
    labels:
      - "dependencies"
      - "rust"
      - "conformance"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2

  # Smithy bare-arrays spec (standalone Gradle project)
  - package-ecosystem: gradle
    directory: "/spec/smithy-bare-arrays"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      smithy-gradle-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(smithy):"
    labels:
      - "dependencies"
      - "spec"
    cooldown:
      default-days: 10
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
