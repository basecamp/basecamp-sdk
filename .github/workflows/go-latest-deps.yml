name: Go Tests (latest dependencies)

# go/go.mod states floors, not pins. As a library, every version it requires
# is forced on downstream apps by MVS, so it should require no more than the
# SDK's own use of each dependency needs (prometheus/client_golang: #997), and
# the "Go Tests" job in test.yml tests exactly those versions. This workflow
# tests the other end: the same module with every dependency upgraded to its
# latest release, so an upstream release that breaks the SDK fails here before
# a consumer finds it. Dependabot no longer proposes client_golang floor raises;
# this job is how we learn about new releases instead.
#
# Triggers
# --------
# - workflow_call: test.yml runs it on every pull request and push to main, so
#   a PR sees whether its change holds up against the latest releases too.
# - schedule: weekly. Upstream releases land with no change in this repository,
#   so on a quiet week nothing else would run the job; the cron is what turns a
#   breaking release into a red run within days rather than at the next PR.
#   Monday 08:00 UTC, after security.yml (06:00) and CodeQL (07:00).
# - workflow_dispatch: manual run, e.g. to confirm a fix for a scheduled failure.
#
# A scheduled failure is signalled the way this repository's other scheduled
# workflows (Live Canary, Scorecard, CodeQL, Security) signal theirs: a failed
# run on the Actions tab and GitHub's failed-run notification for scheduled
# workflows. The step summary names the versions that moved, which is where to
# start.
#
# It upgrades in the runner's checkout and commits nothing. It is not a
# required check: an upstream release can turn it red with no change in the PR
# under test, and whether that should block merges is a separate call.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions: {}

jobs:
  test-go-latest:
    name: Go Tests (latest dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: go
    env:
      # The module alone, as a consumer resolves it. In workspace mode `go get`
      # would also have to reconcile go.work.sum and the sibling modules, which
      # downstream apps never see.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go/go.mod'
          # The cache key hashes the committed go.sum, which the upgrade below
          # makes stale; saving the latest-versions module cache under the floor
          # job's key would only waste it.
          cache: false

      - name: Upgrade dependencies to latest
        # -t -u ./... raises every module the SDK's packages and their tests
        # import, directly or not, to its latest minor or patch release (-t
        # covers test-only modules such as otel/sdk, which -u alone leaves at
        # the committed floor); client_golang is named
        # again so the job keeps testing it should it ever stop being imported
        # from a package -u reaches. Tools (oapi-codegen) stay at their pins:
        # they generate code here and never reach a consumer.
        run: |
          go get -t -u ./...
          go get github.com/prometheus/client_golang@latest
          go mod tidy
          upgraded=$(git diff --unified=0 -- go.mod | grep '^[-+]	' || echo "(nothing newer than the floors)")
          echo "Upgraded from the committed floors:"
          echo "$upgraded"
          {
            echo "### Upgraded from the committed floors"
            echo
            echo '```diff'
            echo "$upgraded"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # No "Dependency manifests unchanged by this job" step, unlike every job
      # in test.yml: rewriting go.mod and go.sum is this job's purpose, and the
      # runner's checkout is discarded with them. The floor job keeps that guard.
