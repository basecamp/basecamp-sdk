name: Release Ruby SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Manual trigger is always dry-run (rehearsal mode)

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smithy:
    uses: ./.github/workflows/smithy-verify.yml
    permissions:
      contents: read

  test:
    name: Test Ruby SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        # zizmor: ignore[cache-poisoning] -- cached deps are for testing, not release artifact generation
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby

      - name: Lint
        run: bundle exec rubocop

      - name: Run tests
        run: bundle exec rake test

  # Building is deliberately separate from publishing: this job carries no
  # `environment:`, so a workflow_dispatch rehearsal runs it from any ref
  # without needing the release-rubygems deployment approval, and it holds no
  # publishing credentials. The publish job below pushes the exact .gem built
  # here rather than rebuilding.
  build:
    name: Build gem
    needs: [smithy, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        # zizmor: ignore[cache-poisoning] -- cache is branch-isolated; fork PRs cannot write to this cache
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ruby

      - name: Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual trigger (dry-run): read from version.rb
            VERSION=$(ruby -e "require_relative 'lib/basecamp/version'; puts Basecamp::VERSION")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Rehearsal for version: $VERSION"
          else
            # Tag trigger: extract from tag (v0.2.1 → 0.2.1)
            VERSION="${GITHUB_REF#refs/tags/v}"
            GEM_VERSION=$(ruby -e "require_relative 'lib/basecamp/version'; puts Basecamp::VERSION")
            if [ "$GEM_VERSION" != "$VERSION" ]; then
              echo "::error::Gem version ($GEM_VERSION) does not match tag version ($VERSION)"
              exit 1
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Releasing version: $VERSION"
          fi

      - name: Build gem
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gem build basecamp-sdk.gemspec
          ls -l "basecamp-sdk-${VERSION}.gem"

      - name: Dry-run report
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::notice::Dry run mode - not actually publishing"
          echo "Would publish: basecamp-sdk-${VERSION}.gem to RubyGems"

      - name: Upload gem
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubygem
          path: ruby/basecamp-sdk-*.gem
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to RubyGems
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release-rubygems
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ruby
    steps:
      - name: Download gem
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rubygem
          path: ruby/

      # No checkout: this job pushes the gem the build job produced, so it needs
      # Ruby but not the repository. bundler-cache is therefore not used either.
      - name: Set up Ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: '3.3'

      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set +e
          output=$(gem push "basecamp-sdk-${VERSION}.gem" 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "Publish succeeded."
          elif echo "$output" | grep -qi "repushing of gem versions is not allowed\|already been pushed"; then
            echo "Version already published — treating as success for idempotency."
          else
            exit "$status"
          fi
          gem exec rubygems-await "basecamp-sdk-${VERSION}.gem"
