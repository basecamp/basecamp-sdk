# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
#
# oapi-codegen configuration for Basecamp SDK
# Generates Go client code from OpenAPI spec with Basecamp-specific extensions
#
package: generated
output: pkg/generated/client.gen.go
generate:
  client: true
  models: true
  embedded-spec: false
output-options:
  # Use custom templates that read x-basecamp-* extensions
  user-templates:
    client.tmpl: templates/client.tmpl
    client-with-responses.tmpl: templates/client-with-responses.tmpl
    typedef.tmpl: templates/typedef.tmpl
    imports.tmpl: templates/imports.tmpl
  # Skip formatting - we'll run gofmt separately
  skip-fmt: false
  # Skip pruning unused types
  skip-prune: false
  # Optional fields are pointers (oapi-codegen's default): a value type cannot
  # represent absence, so absent-vs-zero must be nil-vs-value (SPEC.md §10
  # Optional Fields — no zero-value sentinels). Nil-capable types (slices) keep
  # their native nil via a generic x-go-type-skip-optional-pointer pass in
  # scripts/enhance-openapi-go-types.sh; make go-check-optional-pointers guards
  # the generated output.
