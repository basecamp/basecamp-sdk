[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # chrono is unmaintained (no vulnerability is reported, and no maintained
  # release exists to move to). It is the crate's public date and time type,
  # re-exported as `basecamp_sdk::chrono`, so replacing it with jiff or time is
  # a breaking change of its own; until that lands, record the advisory here
  # rather than fail every Rust check on it.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; it is the public date type, and replacing it is a separate breaking change" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The conformance runner is private and consumes the crate by path with no version,
# which is a wildcard to cargo-deny; a version there would be one more file every bump
# must stamp, for a crate nobody publishes.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
