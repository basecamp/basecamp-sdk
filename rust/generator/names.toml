# Naming tables for the Rust generator. These are the hand-transcribed tables every Basecamp
# SDK generator carries (`TAG_TO_SERVICE`, `SERVICE_SPLITS`, `METHOD_NAME_OVERRIDES`,
# `RESOURCE_TYPE_OVERRIDES` in kotlin/generator/.../Config.kt and swift's ServiceGrouper.swift
# and MethodNaming.swift) and they must agree operation by operation:
# `scripts/check-operation-assignment-parity` and `check-service-inventory-parity` fail when
# they do not. Method overrides are written in the other generators' camelCase and
# snake_cased on the way out, so a row can be compared against Config.kt by eye.
#
# The generator fails when two operations in one service end up with the same method name,
# or when a name is a Rust keyword; this file is where those are settled.

# OpenAPI tag -> service (PascalCase). A tag not listed here is its own name with spaces
# removed. Operations with no tag are "Untagged".
[services]
"Card Tables" = "CardTables"
"Campfire" = "Campfires"
"Todos" = "Todos"
"Messages" = "Messages"
"Files" = "Files"
"Forwards" = "Forwards"
"Schedule" = "Schedules"
"People" = "People"
"Projects" = "Projects"
"Automation" = "Automation"
"ClientFeatures" = "ClientFeatures"
"Boosts" = "Boosts"
"Untagged" = "Miscellaneous"

