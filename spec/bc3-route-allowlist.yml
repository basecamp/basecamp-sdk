# Waivers for scripts/check-bc3-route-parity.
#
# Two directions, two lists. Every entry needs a `reason` that a reader can
# check. Matching is bucket-insensitive, so one entry covers both the
# bucket-scoped and flat spelling of the same route (that bucket/flat choice is
# already policed by check-bucket-flat-parity).
#
# An entry that matches nothing is a HARD FAILURE, not a shrug. A stale waiver
# reads exactly like a covered case, which is how waiver lists rot.
#
# Absorbing any route below should DELETE its entry. The gate will tell you: it
# fails on the now-stale entry.

# ---------------------------------------------------------------------------
# Direction 1 — the SDK declares a route bc3's docs do not describe.
#
# This is the dangerous direction: an entry here is a route the SDK will
# actually send, so a wrong one is a 404 in a shipped consumer. Two such
# defects (ListForwards, RepositionTodolistGroup) are what motivated this gate;
# both are now fixed rather than waived.
#
# Each entry must cite positive evidence that bc3 really serves the route
# despite the docs not showing it — a config/routes.rb line, a controller, or a
# live canary result. "The docs are probably just incomplete" is not evidence.
# ---------------------------------------------------------------------------
sdk_routes_absent_from_bc3_docs:
  - method: GET
    path: /card_tables/steps/:id
    reason: >-
      bc3 draws it at config/routes.rb:167 (resources :steps, only: %i[show update
      destroy], controller: "/steps", inside namespace :kanban path: nil + scope
      path: "card_tables") and covers it at
      test/api/kanban_steps_controller_api_test.rb:10 ("get kanban step via
      unscoped route", asserts :ok). API-renderable:
      app/views/api/steps/show.json.jbuilder exists. The docs omit the standalone
      GET deliberately — card_table_steps.md:22 says steps are returned
      unpaginated as part of the Get-a-card payload — while documenting the
      sibling PUT at the identical path at card_table_steps.md:60.

  - method: GET
    path: /schedule_entries/:id/occurrences/:id
    reason: >-
      Documented, but only in prose, so the extractor cannot see it:
      doc/api/sections/schedule_entries.md:136 describes
      `GET /schedule_entries/2/occurrences/20190218.json` inside the "Get a
      schedule entry" section, with no bullet of its own and no START/END marker
      pair. Routed at config/routes.rb:125, API view
      app/views/api/schedules/entries/occurrences/show.json.jbuilder exists, and
      test/api/schedules/entries/occurrences_controller_api_test.rb has a
      "show occurrence via flat route" test plus a flat/scoped parity test.

  - method: DELETE
    path: /todos/:id
    reason: >-
      bc3 draws it at config/routes.rb:58 (resources :todos, only: %i[show edit
      update destroy]) and covers it at
      test/api/todos_controller_api_test.rb:279, which asserts 204. Undocumented
      because the docs steer clients to
      PUT /buckets/:id/recordings/:id/status/trashed.json (recordings.md:79)
      instead. NOTE the route is fine but the SEMANTICS are not — this endpoint
      archives rather than trashes, tracked in #585. That is a behaviour defect,
      not a routing one, so it is not waivable here and this entry only attests
      that the path exists.

# ---------------------------------------------------------------------------
# Known-defective SDK routes — bc3 does NOT serve these, and we know it.
#
# NOT a waiver of correctness. These are confirmed defects kept in their own
# list so the gate can go green on everything else without pretending they are
# fine. Each one needs a tracking issue and a breaking-change decision, because
# fixing either changes a generated method signature or removes an operation.
#
# Anything here is a live 404 for consumers. Treat the list as a countdown.
# ---------------------------------------------------------------------------
sdk_routes_known_defective:
  - method: POST
    path: /inbox_forwards/:id/replies
    issue: 583
    reason: >-
      Flat create was never drawn — config/routes.rb:150 is
      `resources :replies, only: %i[index show]`. Create exists only
      bucket-scoped at config/routes.rb:1262. bc3 has no flat-create test at any
      path and the docs list only the two GETs. Correct route is
      POST /{accountId}/buckets/{bucketId}/inbox_forwards/{forwardId}/replies.json,
      which adds a path label and so breaks the generated signature in six SDKs.
      Removing the operation is a legitimate alternative — the bucket-scoped
      route is undocumented with zero test/api coverage.

  - method: GET
    path: /recordings/:id
    issue: 584
    reason: >-
      No correct path exists. config/routes.rb:258 is
      `resources :recordings, only: []`, so the flat show is not drawn, and the
      bucket-scoped show at :888 cannot render on the API host: bc3 restricts
      view paths to app/views/api (app/controllers/concerns/api_request.rb,
      keyed on request.host == BC3.api_host) and
      app/views/api/recordings/ holds only partials — no show.json.jbuilder, no
      application/ fallback, no engine tree. There is no
      test/api/recordings_controller_api_test.rb at all. Recommend REMOVING the
      operation, as #504 did for GetEverythingBoosts; ListRecordings already
      covers bc3's only recordings read endpoint.

# ---------------------------------------------------------------------------
# Direction 2 — bc3 documents a route the SDK models no operation for.
#
# Not dangerous, but it is the coverage ledger: this mechanizes the rule
# AGENTS.md already states and nothing enforced — a repin is valid exactly when
# every drift item is either absorbed into the spec or registered. Before this
# gate, advancing the pin required no triage at all.
# ---------------------------------------------------------------------------
bc3_routes_not_modeled:
  # -- Out of scope by design, not coverage gaps --

  - method: GET
    path: /authorization
    reason: >-
      Launchpad identity endpoint, not an account-scoped Basecamp route — it is
      served from https://launchpad.37signals.com/authorization.json, so it is
      absent from openapi.json by design. The SDK does implement it, as the
      client-level authorization service (SPEC §5, `authorization.getInfo()`).

  - method: POST
    path: /integrations/:id/buckets/:id/chats/:id/lines
    reason: >-
      Chatbot line posting authenticates with a per-integration signed URL, not
      a user OAuth token or PAT. It sits outside this SDK's auth model (SPEC
      §16), so modeling it would imply a credential type the client cannot hold.

  # -- Tracked coverage gaps: cloud_files + google_documents (issue #551) --

  - method: GET
    path: /cloud_files/:id
    reason: "Coverage gap tracked in #551 (model cloud_files and google_documents operations)."
  - method: PUT
    path: /cloud_files/:id
    reason: "Coverage gap tracked in #551."
  - method: POST
    path: /vaults/:id/cloud_files
    reason: "Coverage gap tracked in #551."
  - method: GET
    path: /google_documents/:id
    reason: "Coverage gap tracked in #551."
  - method: PUT
    path: /google_documents/:id
    reason: "Coverage gap tracked in #551."
  - method: POST
    path: /vaults/:id/google_documents
    reason: "Coverage gap tracked in #551."

  # -- Tracked coverage gap: dock doors (registry entry) --

  - method: GET
    path: /dock/doors/:id
    reason: >-
      Coverage gap registered in spec/api-gaps/external-links-doors.md, which is
      status `partial-coverage` — its routes list carries the door create but not
      the door show.
  - method: POST
    path: /dock/doors
    reason: "Coverage gap registered in spec/api-gaps/external-links-doors.md (status partial-coverage)."

  # -- Tracked coverage gap: gauge needle CRUD (issue #581) --

  - method: GET
    path: /projects/:id/gauge/needles/:id
    reason: "Coverage gap tracked in #581 (model the gauge needle show/update/destroy operations)."
  - method: PUT
    path: /projects/:id/gauge/needles/:id
    reason: "Coverage gap tracked in #581."
  - method: DELETE
    path: /projects/:id/gauge/needles/:id
    reason: "Coverage gap tracked in #581."

  # -- Tracked coverage gap: timesheet reads + entry writes (issue #582) --

  - method: GET
    path: /projects/:id/recordings/:id/timesheet
    reason: "Coverage gap tracked in #582 (model the recording timesheet read and entry create/delete)."
  - method: POST
    path: /projects/:id/recordings/:id/timesheet/entries
    reason: "Coverage gap tracked in #582."
  - method: DELETE
    path: /timesheet_entries/:id
    reason: "Coverage gap tracked in #582."
