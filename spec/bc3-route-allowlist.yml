# Waivers for scripts/check-bc3-route-parity.
#
# Every entry needs evidence a reader can check. An entry that matches nothing is
# a HARD FAILURE, not a shrug — a stale waiver reads exactly like a covered case,
# which is how waiver lists rot. Absorbing a route should DELETE its entry; the
# gate will tell you.
#
# ── The two directions are matched differently, on purpose ────────────────────
#
# Direction 1 (SDK -> bc3) is matched on EXACT route identity. An SDK route that
# only matches after collapsing /buckets/:id may be a spelling bc3 does not
# serve, which is a live 404 for every caller. Four confirmed defects in this
# SDK are exactly that shape.
#
# Direction 2 (bc3 -> SDK) collapses bucket scoping. It is a coverage ledger
# asking "do we model this resource+verb at all"; which spelling we model is a
# design decision, not a reachability risk. Measured at bc3 d0edc1283b, exact
# matching there reports 143 unmodeled routes of which 125 (87%) are the other
# spelling of something already modeled.
#
# Neither is what check-bucket-flat-parity does: that lint covers only GETs
# returning lists, and checks SDK-internal consistency, never bc3's truth.

# ---------------------------------------------------------------------------
# Proven scope aliases — bc3 serves a FLAT spelling it documents only
# bucket-scoped.
#
# This is the highest-risk list in the file. Asserting an undocumented flat
# route exists is exactly the mistake behind ListForwards, RepositionTodolistGroup,
# CreateForwardReply and GetRecording. Prose is therefore not accepted: the gate
# requires `routes_rb:` naming the line that draws the FLAT form, plus either
# `api_test:` (a test/api path proving it answers) or `api_view:` (the
# app/views/api template it renders).
#
# Remember bc3's API boundary is not route scope. api_request? keys on
# request.host == BC3.api_host, then restrict_view_paths_to_api_root limits view
# paths to app/views/api. So a route is a real API route iff it is DRAWN *and*
# renderable under that restriction — the second half is what condemned
# GetRecording.
# ---------------------------------------------------------------------------
scope_aliases:
  # The three tool-position verbs share one path and one `resource :position`
  # draw. bc3's docs are the wrong authority here: doc/api/sections/tools.md
  # documents ONLY the bucket-scoped spelling (:145, :163, :189) and its
  # "Legacy project-scoped routes" section (:222-230) covers only dock/tools.
  # But bc3 both draws AND tests the flat form. So this is a bc3 documentation
  # gap, not an SDK defect — which is why doc/api is only safe as NEGATIVE
  # evidence when routes.rb and test/api agree with it.
  #
  # `resource :position` (config/routes.rb:226) sits in `concern
  # :recording_actions` (:206), which is included flat at :273 inside
  # `resources :recordings, only: []` (:258, commented "CANONICAL: Top-level
  # unscoped routes for recording actions") and separately bucket-scoped at
  # :902. It carries no `only:`/`except:`, so the singular-resource default set
  # applies and create/update/destroy all exist — checked per verb, because the
  # sibling door position at :947 IS `only: :update`.
  #
  # No app/views/api/recordings/positions/ template exists, and that is correct:
  # Recordings::PositionsController answers `head :created` / `head :ok` /
  # `head :no_content`, matching the SDK's declared 201/200/204. This is the
  # template-less escape hatch, not the GetRecording trap.
  #
  # The flat route survives the @bucket-dependent guards because
  # RecordingScoped#set_recording -> authorize_recording -> authorize_bucket
  # assigns @bucket from the recording, and scoped_bucket_mismatch? is a no-op
  # when params[:bucket_id] is absent.

  - method: POST
    path: /recordings/:id/position
    routes_rb: "config/routes.rb:226 (resource :position in concern :recording_actions), included flat at :273"
    api_test: "test/api/recordings/positions_controller_api_test.rb:36 — \"enable tool via unscoped position create\", asserts :created + positioned?"
    api_view: "none needed — Recordings::PositionsController#create answers head :created"
    reason: >-
      EnableTool. Flat form drawn and API-tested; bc3's tools.md documents only
      the bucket spelling, which is a docs gap on their side.

  - method: DELETE
    path: /recordings/:id/position
    routes_rb: "config/routes.rb:226 (resource :position in concern :recording_actions), included flat at :273"
    api_test: "test/api/recordings/positions_controller_api_test.rb:45 — \"disable tool via unscoped position destroy\", asserts :no_content"
    api_view: "none needed — #destroy answers head :no_content"
    reason: DisableTool. Same draw, destroy action.

  - method: PUT
    path: /recordings/:id/position
    routes_rb: "config/routes.rb:226 (resource :position in concern :recording_actions), included flat at :273"
    api_test: "test/api/recordings/positions_controller_api_test.rb:54 — \"reposition tool via unscoped route\", asserts :ok; :61 adds negative-authorization coverage on the same flat route"
    api_view: "none needed — #update answers head :ok"
    reason: RepositionTool. Same draw, update action.

# ---------------------------------------------------------------------------
# Direction 1 — the SDK declares a route bc3's docs do not describe at all.
#
# Each entry must cite positive evidence bc3 really serves it. "The docs are
# probably just incomplete" is not evidence.
# ---------------------------------------------------------------------------
sdk_routes_absent_from_bc3_docs:
  - method: GET
    path: /card_tables/steps/:id
    reason: >-
      bc3 draws it at config/routes.rb:167 (resources :steps, only: %i[show update
      destroy], controller: "/steps", inside namespace :kanban path: nil + scope
      path: "card_tables") and covers it at
      test/api/kanban_steps_controller_api_test.rb:10 ("get kanban step via
      unscoped route", asserts :ok). API-renderable:
      app/views/api/steps/show.json.jbuilder exists. The docs omit the standalone
      GET deliberately — card_table_steps.md:22 says steps are returned
      unpaginated as part of the Get-a-card payload — while documenting the
      sibling PUT at the identical path at card_table_steps.md:60.

  - method: GET
    path: /schedule_entries/:id/occurrences/:id
    reason: >-
      Documented, but only in prose, so the extractor cannot see it:
      doc/api/sections/schedule_entries.md:136 describes
      `GET /schedule_entries/2/occurrences/20190218.json` inside the "Get a
      schedule entry" section, with no bullet of its own and no START/END marker
      pair. Routed at config/routes.rb:125, API view
      app/views/api/schedules/entries/occurrences/show.json.jbuilder exists, and
      test/api/schedules/entries/occurrences_controller_api_test.rb has a
      "show occurrence via flat route" test plus a flat/scoped parity test.

# ---------------------------------------------------------------------------
# Known-defective SDK routes — bc3 does NOT serve these, and we know it.
#
# NOT a waiver of correctness. Confirmed defects kept in their own list so the
# gate can go green on everything else without pretending they are fine. Each
# needs a numeric `issue:` (the gate enforces it) and a breaking-change decision.
# Anything here is a live 404. Treat the list as a countdown.
#
# The countdown reached zero in the v0.13.0 breaking window: #583 (CreateForwardReply,
# removed), #584 (GetRecording, removed) and #588's nine flat spellings (fixed to their
# bucket-scoped form) were the last entries. Keep it empty — a route that belongs here
# is a shipped 404, and the right move is to fix or remove the operation, not to log it.
# ---------------------------------------------------------------------------
sdk_routes_known_defective: []

# ---------------------------------------------------------------------------
# Direction 2 — bc3 documents a route the SDK models no operation for.
#
# Mechanizes the rule AGENTS.md states and nothing enforced: a repin is valid
# exactly when every drift item is either absorbed into the spec or registered.
#
# Every entry carries exactly ONE structured disposition, which the gate
# validates rather than reading prose:
#
#   tracking_issue: <n>            an open issue owns absorbing it
#   registry: spec/api-gaps/<f>.md a registry entry owns it (file must exist)
#   out_of_scope: <justification>  deliberately never modeled
#   modeled_as: <OperationId>      already modeled at bc3's OTHER spelling
#
# `modeled_as` exists because this direction collapses only a leading
# /buckets/:id (see bc3_route_normalizer.rb). bc3 also serves several resources
# under BOTH a /projects/:id-scoped and a flat spelling, sometimes renaming the
# segment on the way (gauge/needles/:id vs gauge_needles/:id). Those surface here
# as "unmodeled" even though the SDK models the resource+verb perfectly well, and
# a tracking_issue on them is a promise to ship a duplicate operation nobody
# needs.
#
# It is checked, not asserted. The gate requires the named operationId to exist
# in openapi.json, to carry the SAME method, to sit at a DIFFERENT path (an
# identical one would have matched already, making the entry stale), and — the
# load-bearing half — for bc3's own route table to document that path too. So the
# claim "we model this at bc3's other spelling" is verified on both sides, and
# cannot decay into the ListForwards mistake of asserting a spelling bc3 does not
# serve.
#
# One half of the claim stays unmechanizable: spec/bc3-routes.json is extracted
# from doc/api/sections/*.md and holds no controller or action, so "both draws
# name the same controller action" cannot be derived here. That half is demanded
# as evidence instead — every `modeled_as` entry needs a non-empty `routes_rb:`
# citing BOTH draw sites with their enclosing `resources` blocks, saying they
# name the same controller action, citing the bc3 API test that covers the pair
# where one exists, and naming the NEAR MISS it is not: the confusable routes
# here are neighbours in the same file (:740 draws /projects/:id/timesheet five
# lines from :745's /projects/:id/recordings/:id/timesheet). Verify all of that
# by hand before approving — the gate checks the shape, not the destination.
#
# scripts/test-check-bc3-route-parity.rb (`make test-bc3-route-parity`) holds the
# gate to that: it drives adversarial substitutions of REAL operationIds for REAL
# routes through the checker and asserts each is rejected, the interior-segment
# case above included.
# ---------------------------------------------------------------------------
bc3_routes_not_modeled:
  # -- Deliberately out of scope, not coverage gaps --

  - method: GET
    path: /authorization
    out_of_scope: >-
      The identity endpoint, not an account-scoped Basecamp route, so it is
      absent from openapi.json by design. The SDK does implement it, as the
      client-level authorization service (SPEC §5, `authorization.getInfo()`).
      Reasoning corrected at the repin that registered BC3 #12555: this used to say the route is
      served only from https://launchpad.37signals.com/authorization.json, which
      was true when written and is no longer. BC3 #9471 (`eac8b2b476`) draws
      `resource :authorization, only: :show` and renders it from
      app/views/api/authorizations/show.json.jbuilder, so bc3 now serves its own
      copy — and the SDK reaches it, because `Http#get_authorization_document`
      binds to the discovered BC5 issuer. The disposition is unchanged (OAuth is
      outside the OpenAPI spec by design; this lives in the hand-written lane),
      but the two documents' shapes differ, which is registered as
      spec/api-gaps/bc5-authorization-document-shape.md.

  - method: POST
    path: /integrations/:id/buckets/:id/chats/:id/lines
    out_of_scope: >-
      Chatbot line posting authenticates with a per-integration signed URL, not a
      user OAuth token or PAT. It sits outside this SDK's auth model (SPEC §16),
      so modeling it would imply a credential type the client cannot hold.

  # -- dock doors: the two door-scoped routes get DIFFERENT dispositions, decided
  #    2026-08-03. The show route is a redirector and can never be modeled, so it
  #    is out_of_scope, not registered. Only create remains open, and it stays
  #    registered against the partial-coverage entry. Full reasoning, verified
  #    against the pinned bc3 revision, is in the entry's "Disposition of the two
  #    allowlisted door routes" section.
  #
  #    Door index is drawn (bare `resources :doors`, no only:/except:) but has no
  #    app/views/api template, so it is not renderable under the API host. It is
  #    absent here only because spec/bc3-routes.json is extracted from doc/api,
  #    which does not bullet it. --

  - method: GET
    path: /dock/doors/:id
    out_of_scope: >-
      A redirector, not a JSON resource. Docks::DoorsController#show is
      `redirect_to @recording.door.url`, and doc/api/sections/external_links.md
      documents the response as 302 with a Location header pointing at the
      external link's outside URL — there is no representation at any content
      type. Modeling it would make a credentialed client follow a redirect to a
      user-supplied third-party address (four of six SDK transports follow
      redirects by default), and the external URL is already delivered as a
      plain field by the modeled type=Door ListRecordings query.
  - method: POST
    path: /dock/doors
    registry: spec/api-gaps/external-links-doors.md

  # -- gauge needle show/update/destroy (#581) --
  #
  # Not a coverage gap: bc3 draws these three actions twice, once nested under
  # `resource :gauge` (config/routes.rb:737, `resources :needles` with no `only:`)
  # and once flat (config/routes.rb:186, `resources :gauge_needles, only:
  # %i[ show update destroy ]`). Both draws name controller "gauges/needles", so
  # the two spellings are the same action — which
  # test/api/gauges/needles_controller_api_test.rb asserts outright in "unscoped
  # and scoped routes return identical data for needle".
  #
  # doc/api/sections/gauges.md documents both, and the flat GET and PUT carry
  # live example-markers in spec/bc3-routes.json. The SDK models the flat form,
  # which needs no projectId to address a needle. Modeling the scoped spelling
  # too would add three operations across six SDKs for no reachable capability.

  - method: GET
    path: /projects/:id/gauge/needles/:id
    modeled_as: GetGaugeNeedle
    routes_rb: "config/routes.rb:186 draws the flat /gauge_needles/:id; :737, inside `resources :projects` at :676, draws /projects/:id/gauge/needles/:id. Both name controller \"gauges/needles\", read at the pinned revision 2c0dafba13. bc3's API test \"unscoped and scoped routes return identical data for needle\" (test/api/gauges/needles_controller_api_test.rb:42) asserts the two spellings return identical data."
  - method: PUT
    path: /projects/:id/gauge/needles/:id
    modeled_as: UpdateGaugeNeedle
    routes_rb: "config/routes.rb:186 draws the flat /gauge_needles/:id; :737, inside `resources :projects` at :676, draws /projects/:id/gauge/needles/:id. Both name controller \"gauges/needles\", read at the pinned revision 2c0dafba13. bc3's API test \"unscoped and scoped routes return identical data for needle\" (test/api/gauges/needles_controller_api_test.rb:42) asserts the two spellings return identical data."
  - method: DELETE
    path: /projects/:id/gauge/needles/:id
    modeled_as: DestroyGaugeNeedle
    routes_rb: "config/routes.rb:186 draws the flat /gauge_needles/:id; :737, inside `resources :projects` at :676, draws /projects/:id/gauge/needles/:id. Both name controller \"gauges/needles\", read at the pinned revision 2c0dafba13. bc3's API test \"unscoped and scoped routes return identical data for needle\" (test/api/gauges/needles_controller_api_test.rb:42) asserts the two spellings return identical data."

  # -- recording timesheet read + entry create (#582) --
  #
  # Same shape. TimesheetsController#show is drawn project-scoped at
  # config/routes.rb:745 and flat at :266; Timesheets::EntriesController#create at
  # :747 and :268. Both controllers branch on @bucket being nil
  # (TimesheetsController#set_recording, EntriesController#set_parent_recording)
  # and fall back to authorize_recording, so the flat form is not a happy
  # accident — it is the written path. test/api/timesheets_controller_api_test.rb
  # ("show timesheet via flat recording route") and
  # test/api/timesheets/entries_controller_api_test.rb ("create entry via flat
  # recording route") exercise both, and both flat spellings carry live
  # example-markers.

  - method: GET
    path: /projects/:id/recordings/:id/timesheet
    modeled_as: GetRecordingTimesheet
    routes_rb: "config/routes.rb:266 draws the flat /recordings/:id/timesheet; :745 draws the project-scoped form, inside `resources :recordings, only: []` at :744, inside `resources :projects` at :676. Both are `resource :timesheet, only: :show` with no explicit controller, so both resolve to the same TimesheetsController#show. Beware the near-miss five lines up: :740 draws `resource :timesheet` directly under :676, which is /projects/:id/timesheet — the PROJECT's own timesheet, modeled as GetProjectTimesheet. That is a different endpoint, not this route's other spelling, and bc3 covers it as its own test (\"show for project\", test/api/timesheets_controller_api_test.rb:9). bc3's API tests cover THIS pair on both sides: \"show for timesheetable\" (:26) hits the scoped form, \"show timesheet via flat recording route\" (:45) the flat one. Read at the pinned revision 2c0dafba13."
  - method: POST
    path: /projects/:id/recordings/:id/timesheet/entries
    modeled_as: CreateTimesheetEntry
    routes_rb: "config/routes.rb:268 draws the flat /recordings/:id/timesheet/entries; :747 draws the project-scoped form, inside `resources :recordings, only: []` at :744, inside `resources :projects` at :676. Both name controller \"timesheets/entries\", action create. Beware the near-miss: :741 draws entries under the PROJECT timesheet at :740, which is /projects/:id/timesheet/entries and is `only: %i[ show edit update destroy ]` — no create, and a different parent. bc3's API tests cover THIS pair on both sides: \"create entry on project timesheet\" (test/api/timesheets/entries_controller_api_test.rb:11) hits the scoped form, \"create entry via flat recording route\" (:139) the flat one. Read at the pinned revision 2c0dafba13."

